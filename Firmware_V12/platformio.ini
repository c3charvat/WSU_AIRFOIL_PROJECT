 ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common settings for all environments
[env]
platform = ststm32
board = genericSTM32F446ZE
framework = stm32cube
board_build.ldscript = STM32F446ZETx_FLASH.ld
lib_extra_dirs = $PROJECT_DIR/Libary

build_flags = 
  ; FPU configuration for Cortex-M4F
  -mfpu=fpv4-sp-d16
  -mfloat-abi=hard
  -DARM_MATH_CM4
  -D__FPU_PRESENT=1
  ; STM32Cube HAL
  -DUSE_HAL_DRIVER
  -DSTM32F446xx
  ; C++ support
  -std=gnu++17
  -fno-exceptions
  -fno-rtti

build_unflags =
  -std=gnu++11
  -std=gnu++14

; environment setup for a BTT Octopus board with black magic probe connected to the swd interface.
[env:octopus_DEBUG]
lib_extra_dirs = ~/Documents/Arduino/libraries, ~/Documents/WSU_AIRFOIL_PROJECT/Firmware_V12/Libary, $PROJECT_DIR/Libary, $PROJECT_DIR/lua/src, C:\Users\Collin\Documents\WSU_AIRFOIL_GITHUB\WSU_AIRFOIL_PROJECT\Firmware_V12\Libary
build_flags = 
  ${env.build_flags}
  ; Clock configuration (12MHz HSE on BTT Octopus)
  -DHSE_VALUE=12000000L
  -DOCTOPUS_BOARD
  -DOCTOPUS_BOARD_FROM_HSE
; REGARDING USB pins: The board features two USB connectors (one is USB-C and one USB-A)
; the USB-C plug is connected to the pins PA11 and PA12, which is the USB FS (fullspeed) peripheral.
; the USB-A plug is connected to the pins PB14 and PB15, which is for the USB HS (highspeed) in FS mode peripheral.
; (true highspeed needs an external USB PHI connected via ULPI)
; to use the USB-A plug, define 
; PIO_FRAMEWORK_ARDUINO_USB_HIGHSPEED_FULLMODE 
; per https://docs.platformio.org/en/latest/platforms/ststm32.html#configuration
; do not define it if you wish to use the standard USB-C plug.
; there probably is a way to use the two USB peripherals at once, but I have not looked into it.
; QUIRK: without setting this, no  
; data will be received on the serial USB port
; https://github.com/stm32duino/Arduino_Core_STM32/issues/1193
monitor_dtr = 1
; uncomment this for uploading via USB DFU 
; board must be reset into bootloader mode for this (J75 BOOT0 jumper set and reset button pressed once)
debug_tool = blackmagic
debug_port = \\.\COM10 ;<CONFIGURE GDB PORT>
upload_protocol = blackmagic ; SWD interface for the board 
upload_port= \\.\COM10

